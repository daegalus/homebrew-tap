name: Homebrew Bump

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,15 * * *" # daily at 03:00 and 15:00 UTC

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Trust tap
        run: brew trust --tap "$GITHUB_REPOSITORY"

      - name: Configure git
        uses: Homebrew/actions/git-user-config@main

      - name: Install Earthdate
        run: cargo install --git https://github.com/daegalus/earthdate --branch master --locked --root "$RUNNER_TEMP/earthdate"

      - name: Bump packages
        env:
          HOMEBREW_DEVELOPER: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GHA_PAT }}
          GH_TOKEN: ${{ secrets.GHA_PAT }}
        run: |
          python3 scripts/bump.py --tap "$GITHUB_REPOSITORY" --open-pr --no-fork \
            --earthdate "$RUNNER_TEMP/earthdate/bin/earthdate"
